<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16345C"/>
      <stop offset="1" stop-color="#0A1830"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FD3C6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2FD3C6" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="456" cy="452" r="232"/>
    </clipPath>
  </defs>

  <!-- macOS 아이콘 그리드: 1024 캔버스 안에 824 크기 둥근 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- 래더 다이어그램: 노드 3개 (eNB / SGW / PGW) -->
  <g stroke="#5D7FA8" stroke-width="22" stroke-linecap="round">
    <line x1="262" y1="230" x2="262" y2="780"/>
    <line x1="456" y1="230" x2="456" y2="780"/>
    <line x1="650" y1="230" x2="650" y2="780"/>
  </g>

  <!-- 시그널링 메시지 (화살표) -->
  <g stroke="#8FA9C9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M262 330 H430"/><path d="M406 306 L432 330 L406 354"/>
    <path d="M456 600 H624"/><path d="M600 576 L626 600 L600 624"/>
    <path d="M650 700 H288"/><path d="M312 676 L286 700 L312 724"/>
  </g>

  <!-- 렌즈 아래에서 보이는 bearer 터널: 강조색으로 다시 그림 -->
  <circle cx="456" cy="452" r="232" fill="url(#glass)"/>
  <g clip-path="url(#lens)">
    <rect x="262" y="414" width="388" height="76" rx="38" fill="none" stroke="#2FD3C6" stroke-width="22"/>
    <line x1="300" y1="452" x2="612" y2="452" stroke="#FFC857" stroke-width="22" stroke-linecap="round" stroke-dasharray="1 44"/>
    <circle cx="262" cy="452" r="26" fill="#2FD3C6"/>
    <circle cx="456" cy="452" r="26" fill="#2FD3C6"/>
    <circle cx="650" cy="452" r="26" fill="#2FD3C6"/>
  </g>

  <!-- 돋보기 -->
  <circle cx="456" cy="452" r="232" fill="none" stroke="#EAF2FB" stroke-width="40"/>
  <line x1="628" y1="624" x2="790" y2="786" stroke="#EAF2FB" stroke-width="72" stroke-linecap="round"/>
</svg>
