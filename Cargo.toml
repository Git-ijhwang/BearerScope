[workspace]
resolver = "3"
members = ["crates/*", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Git-ijhwang/BearerScope"

[workspace.dependencies]
bearerscope-core = { path = "crates/bearerscope-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
nom="8"
pcap-file = "2"

clap = { version = "4", features = ["derive"]}

[profile.release.package.bearerscope-app]
opt-level = 2